name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # Pinned rather than macos-latest so the SDK that proves the build only changes on purpose.
    # Full Xcode on this runner builds the universal (arm64 + x86_64) app.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: snapshot hook
        run: |
          # The script must keep only rate_limits and write nothing when they are absent.
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME/.claude"
          echo '{"session_id":"s","rate_limits":{"five_hour":{"used_percentage":42,"resets_at":1}}}' | sh scripts/usage-snapshot.sh
          jq -e '.rate_limits.five_hour.used_percentage == 42 and (has("session_id") | not)' "$HOME/.claude/usage-bar.json"
          # A re-render (same session, same api time) must not overwrite; the next reply must.
          echo '{"session_id":"s","cost":{"total_api_duration_ms":100},"rate_limits":{"five_hour":{"used_percentage":50,"resets_at":1}}}' | sh scripts/usage-snapshot.sh
          echo '{"session_id":"s","cost":{"total_api_duration_ms":100},"rate_limits":{"five_hour":{"used_percentage":10,"resets_at":1}}}' | sh scripts/usage-snapshot.sh
          jq -e '.rate_limits.five_hour.used_percentage == 50' "$HOME/.claude/usage-bar.json"
          echo '{"session_id":"s","cost":{"total_api_duration_ms":250},"rate_limits":{"five_hour":{"used_percentage":60,"resets_at":1}}}' | sh scripts/usage-snapshot.sh
          jq -e '.rate_limits.five_hour.used_percentage == 60' "$HOME/.claude/usage-bar.json"
          # Markers are named by a hash, never the session ID, and hold only the api time.
          test "$(ls "$HOME/.claude/usagebar/sessions")" = "$(printf s | shasum -a 256 | cut -c1-16)"
          test "$(cat "$HOME"/.claude/usagebar/sessions/*)" = 250
          rm "$HOME/.claude/usage-bar.json"
          echo '{"session_id":"s"}' | sh scripts/usage-snapshot.sh
          test ! -e "$HOME/.claude/usage-bar.json"
      - name: app bundle
        run: VERSION=ci-${GITHUB_SHA::7} UNIVERSAL=1 ZIP=1 sh scripts/build-app.sh
      - name: usagebar-hook
        run: |
          # Saves only the limits, runs the user's original status line with the same stdin,
          # and prints its output unchanged.
          export HOME="$RUNNER_TEMP/hook-home"; mkdir -p "$HOME/.claude/usagebar"
          hook=build/UsageBar.app/Contents/MacOS/usagebar-hook
          lipo -archs "$hook" | grep -q x86_64
          echo '{"original_status_line":{"type":"command","command":"read x; echo ORIGINAL"}}' > "$HOME/.claude/usagebar/config.json"
          out=$(echo '{"session_id":"s","rate_limits":{"five_hour":{"used_percentage":42,"resets_at":1}}}' | "$hook")
          test "$out" = ORIGINAL
          jq -e '.rate_limits.five_hour.used_percentage == 42 and (tostring | contains("session_id") | not)' "$HOME/.claude/usage-bar.json"
          jq -e '.had_rate_limits == true and .wrote_snapshot == true' "$HOME/.claude/usagebar/last-run.json"
          # A re-render (same session, same api time) must not overwrite; the next reply must.
          echo '{"session_id":"s","cost":{"total_api_duration_ms":100},"rate_limits":{"five_hour":{"used_percentage":50,"resets_at":1}}}' | "$hook" >/dev/null
          echo '{"session_id":"s","cost":{"total_api_duration_ms":100},"rate_limits":{"five_hour":{"used_percentage":10,"resets_at":1}}}' | "$hook" >/dev/null
          jq -e '.rate_limits.five_hour.used_percentage == 50' "$HOME/.claude/usage-bar.json"
          jq -e '.had_rate_limits == true and .wrote_snapshot == false' "$HOME/.claude/usagebar/last-run.json"
          echo '{"session_id":"s","cost":{"total_api_duration_ms":250},"rate_limits":{"five_hour":{"used_percentage":60,"resets_at":1}}}' | "$hook" >/dev/null
          jq -e '.rate_limits.five_hour.used_percentage == 60' "$HOME/.claude/usage-bar.json"
          # The same marker the script uses, so a status line that runs both writes once.
          test "$(ls "$HOME/.claude/usagebar/sessions")" = "$(printf s | shasum -a 256 | cut -c1-16)"
          test "$(cat "$HOME"/.claude/usagebar/sessions/*)" = 250
          echo '{"session_id":"s","cost":{"total_api_duration_ms":250},"rate_limits":{"five_hour":{"used_percentage":70,"resets_at":1}}}' | sh scripts/usage-snapshot.sh
          jq -e '.rate_limits.five_hour.used_percentage == 60' "$HOME/.claude/usage-bar.json"
          echo '{"session_id":"s"}' | "$hook" >/dev/null
          jq -e '.had_rate_limits == false' "$HOME/.claude/usagebar/last-run.json"
          # A status line that never reads stdin closes the pipe early; the hook must still succeed.
          echo '{"original_status_line":{"type":"command","command":"echo hi"}}' > "$HOME/.claude/usagebar/config.json"
          big=$(python3 -c "import json; print(json.dumps({'pad': 'x' * 200000}))")
          for i in $(seq 50); do test "$(printf '%s' "$big" | "$hook")" = hi; done
      - uses: actions/upload-artifact@v7
        with:
          name: UsageBar-macos-universal
          path: dist/*.zip
          retention-days: 30
